<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jaccard 与自主记忆检索：完整实验与证据报告</title>
<style>
:root{color-scheme:light;--bg:#f6f8fb;--paper:#fff;--ink:#172538;--muted:#516174;--line:#dce3ec;--accent:#175db3;--accent-soft:#e9f1fd;--other:#8496ad;--compact:#168177;--input:#2771ba;--cache:#a6bada;--output:#bd8230;--bad:#a83232;--good:#196d55}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:28px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--accent);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}.masthead{padding:32px max(24px,calc((100vw - 1420px)/2));background:var(--ink);color:#fff;display:flex;justify-content:space-between;gap:24px;align-items:center}.masthead p{margin:0;font-size:14px;color:#cfdaea}.masthead strong{font-size:18px;letter-spacing:.03em}.layout{max-width:1420px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;padding:34px 24px 80px}.toc{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;align-self:start;padding-right:12px}.toc h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 12px}.toc a{display:block;color:var(--muted);font-size:13px;line-height:1.6;text-decoration:none;padding:7px 8px;border-left:2px solid transparent}.toc a:hover,.toc a.current{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}main{background:var(--paper);padding:38px 42px;border-radius:8px;min-width:0;box-shadow:0 5px 24px #20354a07}h1{font-size:36px;line-height:1.35;margin:0 0 34px;letter-spacing:-.02em;max-width:850px}h2{font-size:25px;line-height:1.45;margin:58px 0 18px;padding-top:22px;border-top:1px solid var(--line)}h3{font-size:20px;line-height:1.5;margin:32px 0 12px}h4{font-size:17px;margin:24px 0 10px}h5{font-size:15px;margin:20px 0 8px}p{margin:14px 0}strong{font-weight:650}code{font-family:Consolas,monospace;font-size:.9em;overflow-wrap:anywhere;background:var(--bg);padding:1px 4px;border-radius:3px}pre{font:13px/1.6 Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto;background:var(--bg);padding:16px;border:1px solid var(--line);border-radius:5px}pre code{padding:0;background:none;line-height:inherit;font-size:inherit}.table-wrap{max-width:100%;overflow:auto;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.65;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:12px 11px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--bg);font-weight:650;white-space:nowrap}td{min-width:65px}td:first-child{min-width:130px}table tr:hover td{background:var(--accent-soft)}details{margin:12px 0;border:1px solid var(--line);border-radius:5px;padding:10px 14px}summary{cursor:pointer;font-size:14px;font-weight:600;line-height:1.6}details[open]>summary{margin-bottom:10px;color:var(--accent)}details details{background:var(--paper)}.case-box{margin:24px 0;padding:16px;background:var(--bg);border-left:3px solid var(--accent)}.trace-route{font-size:13px;font-family:Consolas,monospace;overflow-wrap:anywhere}.interactive{margin:32px 0;padding:22px;background:var(--bg);border-radius:6px}.interactive h3{margin-top:0}.controls{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0}.controls label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:180px;flex:1}select,button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:40px}select{width:100%;max-width:100%;font-size:14px}button{cursor:pointer}.masthead button{color:#fff;background:transparent;border-color:#53657c;font-size:13px;white-space:nowrap}.chart{width:100%;min-height:280px}.chart svg{display:block;width:100%;font:12px system-ui,sans-serif;color:var(--muted)}.chart text{fill:var(--muted)}.selection-detail{font-size:14px;border-left:3px solid var(--accent);padding:8px 12px;background:var(--paper)}.caption{font-size:13px;color:var(--muted);line-height:1.7}.legend{display:flex;flex-wrap:wrap;gap:20px;font-size:12px;color:var(--muted);margin-bottom:15px}.legend span:before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}.legend-input:before{background:var(--input)}.legend-cache:before{background:var(--cache)}.legend-output:before{background:var(--output)}.bar-row{display:grid;grid-template-columns:160px minmax(0,1fr) 75px;gap:10px;align-items:center;margin:12px 0;font-size:12px}.bar-track{height:18px;background:var(--line);display:flex}.bar-value{text-align:right;font-variant-numeric:tabular-nums}.flow-compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 0}.flow-compare>div{padding:20px;background:var(--bg);border-top:3px solid var(--accent)}.flow-compare ol{padding-left:22px;font-size:14px}.bad{color:var(--bad)}.good{color:var(--good)}.status{font-size:12px;margin-top:5px!important}.toplink{position:fixed;bottom:18px;right:18px;background:var(--paper);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-size:13px;text-decoration:none}.noscript{padding:14px;background:var(--accent-soft)}footer{max-width:1100px;margin:0 auto 35px;padding:0 24px;font-size:12px;color:var(--muted)}
main{overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121b28;--paper:#192535;--ink:#e8eef7;--muted:#b3c0d2;--line:#35455a;--accent:#83b7ff;--accent-soft:#24374f;--other:#7d96b7;--compact:#57c9b9;--input:#5b9de0;--cache:#586e90;--output:#d9a351;--bad:#ffa5a5;--good:#74d4b5}.masthead{background:#0d1420}.masthead strong{color:#e8eef7}}
@media(max-width:1100px){.layout{grid-template-columns:190px minmax(0,1fr);gap:20px;padding:24px 16px}main{padding:28px 26px}.toc a{font-size:12px}h1{font-size:31px}.bar-row{grid-template-columns:130px minmax(0,1fr) 70px}}
@media(max-width:760px){.masthead{padding:20px;align-items:flex-start}.layout{display:block;padding:14px 10px 50px}.toc{position:static;max-height:210px;padding:12px;margin-bottom:16px;border:1px solid var(--line);border-radius:5px}.toc a{font-size:13px;padding:5px 8px}.toc h2{margin-bottom:5px}main{padding:25px 18px}h1{font-size:28px}h2{font-size:23px;margin-top:42px}h3{font-size:19px}.interactive{padding:14px;margin-left:-5px;margin-right:-5px}.controls{gap:10px}.controls label{min-width:150px}.flow-compare{grid-template-columns:1fr}.bar-row{grid-template-columns:105px minmax(0,1fr) 63px;gap:6px;font-size:11px}.case-box{padding:10px}.masthead button{padding:6px 9px}pre{font-size:12px}body{font-size:16px}.toplink{display:none}}
@media print{:root{color-scheme:light;--bg:#fff;--paper:#fff;--ink:#111;--muted:#444;--line:#bbb;--accent:#1e4b78}.masthead,.toc,.toplink,.controls,footer button{display:none}.layout{display:block;padding:0;max-width:none}main{padding:0;box-shadow:none}body{background:white;font-size:10pt;line-height:1.5}h1{font-size:22pt}h2{font-size:16pt;page-break-before:auto}h3{font-size:12pt}table{font-size:8pt}.table-wrap{overflow:visible}pre{max-height:none;overflow:visible;font-size:8pt}details{break-inside:avoid}.interactive{break-inside:avoid}a{color:inherit}h2,h3{break-after:avoid}}
</style>
</head>
<body id="top">
<header class="masthead"><div><strong>经验记忆 · 访问方式比较</strong><p>2026.10.04 · 固定48条基础历史 · 以Jaccard为参照</p><p class="status">%%STATUS%%</p></div><button type="button" id="print-button">打印 / 保存PDF</button></header>
<div class="layout"><nav class="toc" aria-label="报告目录"><h2>阅读目录</h2>%%NAV%%</nav><main><noscript><p class="noscript">交互图需要JavaScript；下方完整正文、静态表格和原始证据仍可阅读。</p></noscript>%%BODY%%</main></div>
<footer>独立HTML · 无外部脚本、无网络请求、无需账户。所有筛选在本地完成。数字为本批观测；请同时阅读分母、评分缺陷与证据边界。</footer><a class="toplink" href="#top">回到顶部 ↑</a>
<script type="application/json" id="report-data">%%DATA%%</script>
<script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),names=D.names,methods=Object.keys(names),fmt=n=>Number(n).toLocaleString('zh-CN'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short={jaccard:'Jaccard',lexical:'关键词事件',hybrid_context:'混合上下文',graph_walk:'图导航',native_files:'原生文件',native_shell:'原生终端',compact_r3:'精简文件·第3轮'};
const scope=document.getElementById('overview-scope'),focus=document.getElementById('overview-method'),pair=document.getElementById('pair-method'),filter=document.getElementById('pair-filter');
for(const m of methods){focus.add(new Option(names[m],m));if(m!=='jaccard')pair.add(new Option(names[m],m));}focus.value='compact_r3';pair.value='compact_r3';
function overview(){const k=scope.value,chosen=focus.value,host=document.getElementById('quality-chart'),w=Math.max(host.clientWidth,260),h=w<430?300:340,p={l:48,r:20,t:30,b:52},xmax=Math.max(...methods.map(m=>D.summary[m][k].tokens))*1.13,ymax=35,x=v=>p.l+v/xmax*(w-p.l-p.r),y=v=>h-p.b-v/ymax*(h-p.t-p.b);let svg=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="各配置总tokens与正确题数，越左越省、越高成功越多">`;
for(let n=0;n<=30;n+=5)svg+=`<line x1="${p.l}" x2="${w-p.r}" y1="${y(n)}" y2="${y(n)}" stroke="var(--line)"/><text x="${p.l-9}" y="${y(n)+4}" text-anchor="end">${n}</text>`;
const ticks=w<430?3:5;for(let i=0;i<=ticks;i++){const n=xmax*i/ticks;svg+=`<text x="${x(n)}" y="${h-p.b+22}" text-anchor="${i===0?'start':i===ticks?'end':'middle'}">${Math.round(n/1000)}k</text>`;}
svg+=`<text x="${p.l}" y="16">正确题数</text><text x="${w-p.r}" y="${h-8}" text-anchor="end">总tokens（含缓存、输出）</text>`;
for(const m of methods){const v=D.summary[m][k],active=m===chosen,color=m==='jaccard'?'var(--accent)':m==='compact_r3'?'var(--compact)':'var(--other)',r=active?8:5;svg+=`<circle cx="${x(v.tokens)}" cy="${y(v.correct)}" r="${r}" fill="${color}" opacity="${active||m==='jaccard'?1:.7}"><title>${esc(names[m])}：${v.correct}/${v.scorable}；${fmt(v.tokens)} tokens</title></circle>`;if((active||m==='jaccard')&&w>=430){const anchor=x(v.tokens)>w*.68?'end':'start',dx=anchor==='end'?-11:11,dy=m==='jaccard'?20:-13;svg+=`<text x="${x(v.tokens)+dx}" y="${y(v.correct)+dy}" text-anchor="${anchor}" style="fill:var(--ink);font-weight:600">${esc(short[m])} · ${v.correct}/${v.scorable}</text>`;}}
host.innerHTML=svg+'</svg>';const v=D.summary[chosen][k],b=D.summary.jaccard[k];document.getElementById('overview-detail').textContent=`${names[chosen]}：${v.correct}/${v.scorable}正确，${fmt(v.tokens)} tokens（Jaccard的${(v.tokens/b.tokens).toFixed(2)}倍）；${v.model_calls}次模型调用、${v.python_calls}次Python。成本包含${v.tasks}次执行。`;
const max=Math.max(...methods.map(m=>D.summary[m][k].tokens));document.getElementById('cost-bars').innerHTML=methods.map(m=>{const s=D.summary[m][k];return `<div class="bar-row"><span>${esc(short[m])}</span><div class="bar-track" role="img" aria-label="${esc(names[m])} 非缓存输入 ${s.input_tokens}，缓存 ${s.cache_tokens}，输出 ${s.output_tokens}">${[['input_tokens','input'],['cache_tokens','cache'],['output_tokens','output']].map(([f,c])=>`<span style="width:${s[f]/max*100}%;background:var(--${c})"></span>`).join('')}</div><span class="bar-value">${(s.tokens/1000).toFixed(1)}k</span></div>`}).join('');}
function pairs(){const m=pair.value,f=filter.value,all=D.rows.filter(r=>r.method===m),rows=all.filter(r=>f==='all'||r.outcome_pair===f),q=D.summary[m].paired;document.getElementById('pair-summary').textContent=`${names[m]}：新增成功${q.gains.length}题，损失${q.losses.length}题；${q.lower_token_tasks}/46题更省tokens。当前展示${rows.length}题。`;
document.querySelector('#pair-table tbody').innerHTML=rows.map(r=>{const state=b=>!r.scorable?'不计分':b?'通过':'未通过',n=r.token_delta;return `<tr><td>${esc(r.task_id.replace('new:',''))}</td><td>${state(r.jaccard_correct)}</td><td>${state(r.correct)}</td><td class="${n>0?'bad':n<0?'good':''}">${n>0?'+':''}${fmt(n)}</td><td>${r.python_delta>0?'+':''}${r.python_delta}</td><td>${r.memory_calls}</td><td>${r.source_exposed===null?'未知':r.source_exposed?'有片段':'未记录'}</td></tr>`}).join('');}
scope.addEventListener('change',overview);focus.addEventListener('change',overview);pair.addEventListener('change',pairs);filter.addEventListener('change',pairs);new ResizeObserver(overview).observe(document.getElementById('quality-chart'));overview();pairs();document.getElementById('print-button').addEventListener('click',()=>window.print());
const toc=new Map([...document.querySelectorAll('.toc a')].map(a=>[decodeURIComponent(a.hash.slice(1)),a]));const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){for(const a of toc.values())a.classList.remove('current');toc.get(e.target.id)?.classList.add('current');}},{rootMargin:'-5% 0px -70% 0px'});document.querySelectorAll('main h2[id]').forEach(e=>observer.observe(e));
window.reportReady={methods:methods.length,rows:D.rows.length,offline:true};
})();
</script>
</body>
</html>
